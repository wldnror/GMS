name: Python quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
